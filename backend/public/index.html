<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instagram Scheduler Admin</title>
  <style>
    :root { --blue:#2563eb; --green:#16a34a; --red:#dc2626; --gray:#6b7280; --bg:#f5f7fb; --card:#fff; --line:#e5e7eb; --dark:#111827; }
    * { box-sizing:border-box; }
    body { font-family:Arial,Tahoma,sans-serif; background:var(--bg); margin:0; color:var(--dark); }
    .wrap { max-width:1180px; margin:24px auto; padding:14px; }
    .card { background:var(--card); border-radius:22px; padding:22px; box-shadow:0 10px 28px rgba(15,23,42,.08); margin-bottom:18px; border:1px solid rgba(229,231,235,.8); }
    .topbar { display:flex; gap:12px; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; }
    h1,h2 { margin:0 0 8px; }
    .small { color:var(--gray); font-size:13px; }
    label { display:block; margin-top:14px; font-weight:700; }
    input,textarea,select,button { width:100%; padding:12px; border:1px solid #d1d5db; border-radius:12px; margin-top:8px; font-size:15px; font-family:inherit; }
    textarea { min-height:105px; resize:vertical; }
    button { background:var(--blue); color:white; border:none; cursor:pointer; font-weight:800; transition:.15s; }
    button:hover { filter:brightness(.92); transform:translateY(-1px); }
    button:disabled { opacity:.55; cursor:not-allowed; transform:none; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .msg { margin-top:14px; padding:12px; border-radius:12px; display:none; white-space:pre-wrap; direction:rtl; }
    .ok { background:#dcfce7; color:#166534; display:block; }
    .err { background:#fee2e2; color:#991b1b; display:block; }
    .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:14px 0; }
    .stat { background:#f9fafb; border:1px solid var(--line); border-radius:16px; padding:14px; text-align:center; }
    .stat span { display:block; font-size:25px; font-weight:900; color:var(--blue); }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
    .tab { width:auto; margin:0; padding:10px 14px; background:#eef2ff; color:#1e3a8a; }
    .tab.active { background:var(--blue); color:white; }
    .filters { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:10px; align-items:end; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; align-items:center; }
    .actions button { width:auto; margin:0; padding:10px 14px; }
    .danger { background:var(--red)!important; }
    .secondary { background:#4b5563!important; }
    .success { background:var(--green)!important; }
    .purple { background:#9333ea!important; }
    .selected-info { color:var(--gray); font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .post { border:1px solid var(--line); border-radius:18px; overflow:hidden; background:white; display:flex; flex-direction:column; min-height:100%; }
    .media { height:210px; background:#111827; display:flex; align-items:center; justify-content:center; position:relative; }
    .media img,.media video { width:100%; height:100%; object-fit:cover; }
    .check { position:absolute; top:10px; right:10px; width:22px; height:22px; margin:0; accent-color:var(--blue); }
    .body { padding:13px; display:flex; flex-direction:column; gap:8px; flex:1; }
    .badges { display:flex; gap:6px; flex-wrap:wrap; direction:ltr; justify-content:flex-end; }
    .badge { display:inline-block; padding:4px 9px; border-radius:999px; color:white; font-size:12px; font-weight:900; }
    .b-image { background:#059669; } .b-video { background:#dc2626; } .b-queued { background:#2563eb; } .b-published { background:#16a34a; } .b-failed { background:#dc2626; } .b-ready_now { background:#9333ea; }
    .caption { line-height:1.5; max-height:70px; overflow:auto; background:#f9fafb; padding:8px; border-radius:10px; white-space:pre-wrap; }
    .meta { font-size:13px; color:#374151; direction:ltr; text-align:right; }
    .error { color:#b91c1c; background:#fee2e2; padding:8px; border-radius:10px; font-size:12px; direction:ltr; text-align:left; max-height:70px; overflow:auto; }
    .post-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:auto; }
    .post-actions button { margin:0; padding:9px; font-size:13px; }
    dialog { border:none; border-radius:18px; padding:0; width:min(620px,94vw); box-shadow:0 20px 70px rgba(0,0,0,.3); }
    dialog::backdrop { background:rgba(15,23,42,.45); }
    .modal { padding:20px; }
    .empty { padding:28px; text-align:center; color:var(--gray); background:#f9fafb; border-radius:16px; border:1px dashed #d1d5db; }
    @media (max-width:900px){ .grid{grid-template-columns:repeat(2,1fr);} .filters,.stats{grid-template-columns:1fr 1fr;} }
    @media (max-width:620px){ .wrap{margin:8px auto;padding:8px;} .card{padding:15px;border-radius:16px;} .row,.filters,.stats,.grid{grid-template-columns:1fr;} .media{height:230px;} .actions button{flex:1;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="topbar">
        <div>
          <h1>🚀 لوحة جدولة إنستغرام</h1>
          <div class="small">التوقيت المستخدم: الكويت Asia/Kuwait</div>
        </div>
        <button style="width:auto;margin:0" onclick="loadPosts()">تحديث</button>
      </div>
      <form id="scheduleForm">
        <label>الصور / الفيديوهات</label>
        <input type="file" name="images" accept="image/*,video/mp4,video/quicktime,video/webm" multiple required />
        <label>الكابشن</label>
        <textarea name="caption" placeholder="اكتبي الكابشن هنا..."></textarea>
        <div class="row">
          <div><label>طريقة النشر</label><select name="mode"><option value="daily">جدولة يومية بالترتيب</option><option value="now">نشر الآن</option></select></div>
          <div><label>وقت أول منشور</label><input type="datetime-local" name="publishTime" /></div>
        </div>
        <button type="submit">حفظ / نشر</button>
      </form>
      <div id="message" class="msg"></div>
    </div>

    <div class="card">
      <h2>📋 إدارة المنشورات</h2>
      <div class="stats">
        <div class="stat"><span id="countAll">0</span><small>الكل</small></div>
        <div class="stat"><span id="countQueued">0</span><small>مجدول</small></div>
        <div class="stat"><span id="countPublished">0</span><small>منشور</small></div>
        <div class="stat"><span id="countFailed">0</span><small>فشل</small></div>
        <div class="stat"><span id="countVideos">0</span><small>فيديو</small></div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="filters">
        <div><label>بحث بالكابشن</label><input id="searchBox" placeholder="ابحثي..." oninput="renderPosts()"></div>
        <div><label>النوع</label><select id="typeFilter" onchange="renderPosts()"><option value="all">كل الأنواع</option><option value="image">صور</option><option value="video">فيديو</option></select></div>
        <div><label>الترتيب</label><select id="sortFilter" onchange="renderPosts()"><option value="scheduledAsc">الأقرب للنشر</option><option value="scheduledDesc">الأبعد للنشر</option><option value="createdDesc">الأحدث إضافة</option><option value="createdAsc">الأقدم إضافة</option></select></div>
        <div><label>عرض</label><select id="limitFilter" onchange="renderPosts()"><option value="all">الكل</option><option value="12">12</option><option value="24">24</option><option value="48">48</option></select></div>
      </div>
      <div class="actions">
        <button class="secondary" onclick="toggleSelectAll()">تحديد / إلغاء الكل</button>
        <button class="danger" onclick="deleteSelected()">حذف المحدد</button>
        <button class="success" onclick="bulkStatus('queued')">إرجاع للجدولة</button>
        <button class="purple" onclick="bulkStatus('ready_now')">جاهز للنشر الآن</button>
        <span class="selected-info" id="selectedInfo">0 محدد</span>
      </div>
      <div id="posts" class="grid"></div>
    </div>
  </div>

  <dialog id="editDialog">
    <div class="modal">
      <h2>تعديل المنشور</h2>
      <input type="hidden" id="editId">
      <label>الكابشن</label><textarea id="editCaption"></textarea>
      <label>وقت الجدولة</label><input type="datetime-local" id="editScheduledAt">
      <div class="actions">
        <button onclick="saveEdit()">حفظ التعديل</button>
        <button class="secondary" onclick="editDialog.close()">إغلاق</button>
      </div>
    </div>
  </dialog>

<script>
const form = document.getElementById('scheduleForm');
const message = document.getElementById('message');
const postsBox = document.getElementById('posts');
const tabsBox = document.getElementById('tabs');
const editDialog = document.getElementById('editDialog');
const KUWAIT_TZ = 'Asia/Kuwait';
let allPosts = [];
let currentStatus = 'all';
const statuses = [['all','الكل'],['queued','مجدولة'],['published','منشورة'],['failed','فاشلة'],['ready_now','جاهزة الآن']];

function showMessage(text, ok=true){ message.className='msg '+(ok?'ok':'err'); message.textContent=text; }
function escapeHtml(text){ return String(text ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function getPostUrl(p){ return p.mediaUrl || p.imageUrl || p.videoUrl || p.media_url || p.video_url || ''; }
function getPostType(p){ if(p.mediaType) return p.mediaType; if(p.videoUrl||p.video_url) return 'video'; return /\.(mp4|mov|webm)(\?|$)/i.test(getPostUrl(p))?'video':'image'; }
function formatKuwaitTime(value){ if(!value) return '—'; const d=new Date(value); if(isNaN(d)) return '—'; return new Intl.DateTimeFormat('en-GB',{timeZone:KUWAIT_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:true}).format(d).replace(',',''); }
function toDatetimeLocal(value){ if(!value) return ''; const d=new Date(value); const parts=new Intl.DateTimeFormat('en-CA',{timeZone:KUWAIT_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{}); return `${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}`; }
function badge(text, cls){ return `<span class="badge ${cls}">${text}</span>`; }

function selectedIds(){ return Array.from(document.querySelectorAll('.check:checked')).map(x=>x.value); }
function updateSelectedInfo(){ document.getElementById('selectedInfo').textContent = `${selectedIds().length} محدد`; }

form.addEventListener('submit', async e => {
  e.preventDefault(); showMessage('جاري الرفع...', true);
  const data = new FormData(form);
  try{
    const res = await fetch('/api/schedule', {method:'POST', body:data});
    const json = await res.json();
    if(!res.ok || !json.ok) return showMessage('خطأ: '+(json.message||'حدث خطأ'), false);
    showMessage('تم بنجاح ✅\n'+(json.message||''), true); form.reset(); loadPosts();
  }catch(err){ showMessage('خطأ اتصال: '+err.message, false); }
});

function renderTabs(){
  tabsBox.innerHTML = statuses.map(([key,label]) => `<button class="tab ${currentStatus===key?'active':''}" onclick="currentStatus='${key}';renderTabs();renderPosts();">${label}</button>`).join('');
}
function updateStats(posts){
  countAll.textContent=posts.length; countQueued.textContent=posts.filter(p=>p.status==='queued').length; countPublished.textContent=posts.filter(p=>p.status==='published').length; countFailed.textContent=posts.filter(p=>p.status==='failed').length; countVideos.textContent=posts.filter(p=>getPostType(p)==='video').length;
}
function mediaPreview(p){ const url=getPostUrl(p); if(!url) return '<div class="small">لا يوجد ملف</div>'; return getPostType(p)==='video' ? `<video src="${escapeHtml(url)}" controls muted playsinline></video>` : `<img src="${escapeHtml(url)}" alt="preview">`; }
function filteredPosts(){
  const search=(searchBox.value||'').toLowerCase(); const type=typeFilter.value; const sort=sortFilter.value;
  let posts=[...allPosts].filter(p => (currentStatus==='all'||p.status===currentStatus) && (type==='all'||getPostType(p)===type) && (!search||String(p.caption||'').toLowerCase().includes(search)));
  posts.sort((a,b)=>{ const sa=new Date(a.scheduledAt||0), sb=new Date(b.scheduledAt||0), ca=new Date(a.createdAt||0), cb=new Date(b.createdAt||0); if(sort==='scheduledDesc') return sb-sa; if(sort==='createdDesc') return cb-ca; if(sort==='createdAsc') return ca-cb; return sa-sb; });
  const limit=limitFilter.value; return limit==='all'?posts:posts.slice(0, Number(limit));
}
function renderPosts(){
  const posts=filteredPosts();
  if(!posts.length){ postsBox.className=''; postsBox.innerHTML='<div class="empty">لا توجد منشورات مطابقة.</div>'; updateSelectedInfo(); return; }
  postsBox.className='grid';
  postsBox.innerHTML = posts.map(p => {
    const type=getPostType(p), url=getPostUrl(p);
    return `<article class="post">
      <div class="media"><input class="check" type="checkbox" value="${escapeHtml(p.id)}" onchange="updateSelectedInfo()">${mediaPreview(p)}</div>
      <div class="body">
        <div class="badges">${badge(type.toUpperCase(), type==='video'?'b-video':'b-image')}${badge(p.status||'unknown','b-'+(p.status||''))}</div>
        <div class="meta">🕒 ${formatKuwaitTime(p.scheduledAt)}</div>
        <div class="caption">${escapeHtml(p.caption || 'بدون كابشن')}</div>
        ${p.error ? `<div class="error">${escapeHtml(p.error)}</div>` : ''}
        <div class="post-actions">
          <button onclick="openEdit('${escapeHtml(p.id)}')">تعديل</button>
          <button class="success" onclick="publishExisting('${escapeHtml(p.id)}')">نشر الآن</button>
          <button class="secondary" onclick="setStatus('${escapeHtml(p.id)}','queued')">جدولة</button>
          <button class="danger" onclick="deletePost('${escapeHtml(p.id)}')">حذف</button>
        </div>
      </div>
    </article>`;
  }).join('');
  updateSelectedInfo();
}
async function loadPosts(){ postsBox.className=''; postsBox.innerHTML='<div class="empty">جاري التحميل...</div>'; try{ const res=await fetch('/api/posts?ts='+Date.now()); allPosts=await res.json(); updateStats(allPosts); renderTabs(); renderPosts(); }catch(err){ postsBox.innerHTML='<div class="empty">خطأ في تحميل القائمة: '+escapeHtml(err.message)+'</div>'; } }
function toggleSelectAll(){ const boxes=Array.from(document.querySelectorAll('.check')); const check=boxes.some(b=>!b.checked); boxes.forEach(b=>b.checked=check); updateSelectedInfo(); }
async function apiJson(url, options={}){ const res=await fetch(url,{headers:{'Content-Type':'application/json'},...options}); const json=await res.json().catch(()=>({})); if(!res.ok || json.ok===false) throw new Error(json.message||'حدث خطأ'); return json; }
async function deletePost(id){ if(!confirm('حذف هذا المنشور؟')) return; try{ await apiJson('/api/posts/'+id,{method:'DELETE'}); showMessage('تم الحذف ✅'); loadPosts(); }catch(err){ showMessage('خطأ: '+err.message,false); } }
async function deleteSelected(){ const ids=selectedIds(); if(!ids.length) return showMessage('اختاري منشور واحد على الأقل',false); if(!confirm('حذف المنشورات المحددة؟')) return; try{ const j=await apiJson('/api/posts/bulk-delete',{method:'POST',body:JSON.stringify({ids})}); showMessage(j.message||'تم الحذف ✅'); loadPosts(); }catch(err){ showMessage('خطأ: '+err.message,false); } }
async function bulkStatus(status){ const ids=selectedIds(); if(!ids.length) return showMessage('اختاري منشور واحد على الأقل',false); try{ const j=await apiJson('/api/posts/bulk-status',{method:'POST',body:JSON.stringify({ids,status})}); showMessage(j.message||'تم التحديث ✅'); loadPosts(); }catch(err){ showMessage('خطأ: '+err.message,false); } }
async function setStatus(id,status){ try{ await apiJson('/api/posts/'+id,{method:'PATCH',body:JSON.stringify({status})}); showMessage('تم تحديث الحالة ✅'); loadPosts(); }catch(err){ showMessage('خطأ: '+err.message,false); } }
function openEdit(id){ const p=allPosts.find(x=>String(x.id)===String(id)); if(!p) return; editId.value=p.id; editCaption.value=p.caption||''; editScheduledAt.value=toDatetimeLocal(p.scheduledAt); editDialog.showModal(); }
async function saveEdit(){ try{ const payload={caption:editCaption.value, scheduledAt:editScheduledAt.value}; const j=await apiJson('/api/posts/'+editId.value,{method:'PATCH',body:JSON.stringify(payload)}); editDialog.close(); showMessage(j.message||'تم الحفظ ✅'); loadPosts(); }catch(err){ showMessage('خطأ: '+err.message,false); } }
async function publishExisting(id){ if(!confirm('نشر هذا المنشور الآن على إنستغرام؟')) return; try{ showMessage('جاري محاولة النشر...',true); const j=await apiJson('/api/posts/'+id+'/publish-now',{method:'POST'}); showMessage(j.message||'تم النشر ✅'); loadPosts(); }catch(err){ showMessage('فشل النشر: '+err.message,false); loadPosts(); } }

renderTabs(); loadPosts();
</script>
</body>
</html>
