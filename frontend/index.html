<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Scheduler</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 40px;
      text-align: center;
    }

    .card {
      background: white;
      max-width: 560px;
      margin: auto;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: right;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      cursor: pointer;
      margin-top: 12px;
      font-weight: bold;
    }

    .btn-publish {
      background: #1683ff;
      color: white;
    }

    .btn-schedule {
      background: #13a463;
      color: white;
    }

    .btn-clear {
      background: #eee;
      color: #222;
    }

    #result {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      min-height: 24px;
      direction: rtl;
      white-space: pre-wrap;
    }

    .success {
      background: #e8fff1;
      color: #0b6b38;
    }

    .error {
      background: #fff0f0;
      color: #a10000;
    }

    .info {
      background: #eef6ff;
      color: #174b7a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      font-size: 13px;
      direction: ltr;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      word-break: break-word;
    }

    th {
      background: #f1f1f1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 نشر وجدولة صور وفيديو على إنستغرام</h1>

    <label for="image">نشر صورة أو فيديو الآن</label>
    <input type="file" id="image" accept="image/*,video/mp4" />

    <label for="captionNow">الكابشن للنشر الآن</label>
    <textarea id="captionNow" placeholder="اكتبي الكابشن هنا..."></textarea>

    <button class="btn-publish" onclick="publishNow()">📤 نشر الآن</button>

    <hr style="margin: 24px 0;" />

    <label for="images">رفع عدة صور أو فيديو للجدولة اليومية</label>
    <input type="file" id="images" multiple accept="image/*,video/mp4" />

    <label for="captionBulk">الكابشن للصور والفيديو المجدولة</label>
    <textarea id="captionBulk" placeholder="اكتبي الكابشن هنا..."></textarea>

    <label for="publishTime">وقت النشر اليومي</label>
    <input type="time" id="publishTime" value="09:00" />

    <label for="startDate">تاريخ البداية اختياري</label>
    <input type="date" id="startDate" />

    <button class="btn-schedule" onclick="scheduleBulk()">🗓️ جدولة الصور والفيديو يومياً</button>
    <button class="btn-clear" onclick="loadScheduledPosts()">🔄 تحديث الجدول</button>
    <button class="btn-clear" onclick="clearScheduledPosts()">🧹 مسح الجدول المؤقت</button>

    <div id="result"></div>

    <div id="scheduledBox"></div>
  </div>

  <script>
    const API_BASE = 'https://instagram-scheduler-production-81b4.up.railway.app';

    function setResult(message, type = 'info') {
      const el = document.getElementById('result');
      el.className = type;
      el.textContent = message;
    }

    async function publishNow() {
      const file = document.getElementById('image').files[0];
      const caption = document.getElementById('captionNow').value;

      if (!file) {
        setResult('❌ اختاري صورة أو فيديو أولاً', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('media', file);
      formData.append('caption', caption);
      formData.append('mode', 'now');

      setResult('⏳ جاري الرفع والنشر الآن...', 'info');

      try {
        const res = await fetch(`${API_BASE}/api/schedule`, {
          method: 'POST',
          body: formData,
        });

        const data = await res.json();

        if (data.ok) {
          setResult('✅ تم رفع الملف وطلب النشر بنجاح', 'success');
          await loadScheduledPosts();
        } else {
          setResult('❌ فشل النشر:\n' + JSON.stringify(data.error || data, null, 2), 'error');
        }
      } catch (error) {
        setResult('❌ خطأ اتصال: ' + error.message, 'error');
      }
    }

    async function scheduleBulk() {
      const files = document.getElementById('images').files;
      const caption = document.getElementById('captionBulk').value;
      const publishTime = document.getElementById('publishTime').value;
      const startDate = document.getElementById('startDate').value;

      if (!files.length) {
        setResult('❌ اختاري صور أو فيديو أولاً', 'error');
        return;
      }

      const formData = new FormData();
      for (const file of files) {
        formData.append('media', file);
      }

      formData.append('caption', caption);
      formData.append('publishTime', publishTime);
      formData.append('mode', 'daily');
      if (startDate) formData.append('startDate', startDate);

      setResult('⏳ جاري رفع وجدولة الصور والفيديو...', 'info');

      try {
        const res = await fetch(`${API_BASE}/api/schedule`, {
          method: 'POST',
          body: formData,
        });

        const data = await res.json();

        if (data.ok) {
          setResult(`✅ تمت الجدولة بنجاح`, 'success');
          await loadScheduledPosts();
        } else {
          setResult('❌ فشلت الجدولة:\n' + JSON.stringify(data.error || data, null, 2), 'error');
        }
      } catch (error) {
        setResult('❌ خطأ اتصال: ' + error.message, 'error');
      }
    }

    async function loadScheduledPosts() {
      try {
        const res = await fetch(`${API_BASE}/api/posts`);
        const data = await res.json();

        const posts = Array.isArray(data) ? data : (data.posts || []);

        const box = document.getElementById('scheduledBox');
        if (!posts.length) {
          box.innerHTML = '<p>لا توجد صور أو فيديو مجدولة حالياً.</p>';
          return;
        }

        box.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>File</th>
                <th>Media Type</th>
                <th>Publish At</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${posts.map(post => `
                <tr>
                  <td>${post.originalName || post.id || ''}</td>
                  <td>${post.mediaType || post.media_type || ''}</td>
                  <td>${post.scheduledAt ? new Date(post.scheduledAt).toLocaleString() : ''}</td>
                  <td>${post.status || ''}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        setResult('❌ فشل تحديث الجدول: ' + error.message, 'error');
      }
    }

    async function clearScheduledPosts() {
      setResult('⚠️ المسح غير مفعّل في النسخة الجديدة حفاظاً على الصور والفيديو المجدولة.', 'info');
    }

    loadScheduledPosts();
  </script>
</body>
</html>
